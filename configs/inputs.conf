# ==============================================================================
# Splunk Universal Forwarder / Indexer inputs.conf
# Environment: Enterprise SOC Windows Endpoint & Server Telemetry
# ==============================================================================

[default]
host = SEC-ENDPOINT-01

# --- Windows Security Event Logs (Auth, Kerberos, Audit) ---
[WinEventLog://Security]
disabled = 0
index = win_security
sourcetype = WinEventLog:Security
renderXml = 0
# Whitelist critical security events to optimize license & index performance
whitelist = 4624,4625,4688,4720,4722,4728,4732,4738,4768,4769,4771,4776,7045

# --- Windows System Event Logs (Service Installations, Driver Loads) ---
[WinEventLog://System]
disabled = 0
index = win_system
sourcetype = WinEventLog:System
renderXml = 0
whitelist = 7045,7036,104,1102

# --- Windows PowerShell Operational Logs (ScriptBlock Logging - Event 4104) ---
[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = 0
index = win_security
sourcetype = WinEventLog:Microsoft-Windows-PowerShell/Operational
renderXml = 0
whitelist = 4103,4104

# --- Microsoft Sysmon Operational Telemetry (Process, Network, LSASS, File) ---
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = win_sysmon
sourcetype = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
renderXml = 1
# Events: 1 (Process Create), 3 (Network Connect), 7 (Image Load), 10 (ProcessAccess), 11 (FileCreate), 13 (Registry)
whitelist = 1,3,7,8,10,11,12,13,22

# --- Network Zeek Connection Logs (JSON) ---
[monitor:///opt/zeek/logs/current/conn.log]
disabled = 0
index = zeek_net
sourcetype = zeek:conn:json
