title: Microsoft Office Spawning Shell or Script Interpreter
id: f47d0e34-58a2-4a7b-a339-16a7605d3c82
status: production
description: Detects Microsoft Office applications (Word, Excel, PowerPoint) spawning script engines (powershell.exe, cmd.exe, wscript.exe, certutil.exe) which is a common indicator of malicious macro or CVE weaponization.
references:
    - https://attack.mitre.org/techniques/T1204/002/
    - https://attack.mitre.org/techniques/T1059/001/
author: SOC Detection Engineering Team
date: 2026-04-16
tags:
    - attack.execution
    - attack.initial_access
    - attack.t1204.002
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    parent_office:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\eqnedt32.exe'
            - '\outlook.exe'
    target_interpreters:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\certutil.exe'
            - '\bitsadmin.exe'
            - '\rundll32.exe'
    condition: parent_office and target_interpreters
falsepositives:
    - Custom enterprise Excel Add-ins executing approved automation scripts (whitelisted via digital signature)
level: critical
