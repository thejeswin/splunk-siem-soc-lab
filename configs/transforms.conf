# ==============================================================================
# Splunk transforms.conf - Lookup Definitions & Filtering Transforms
# ==============================================================================

[known_admin_service_accounts]
filename = known_admin_service_accounts.csv
case_sensitive_match = false

[ntstatus_lookup]
filename = ntstatus_codes.csv
case_sensitive_match = false

[powershell_indicators]
filename = powershell_indicators.csv
case_sensitive_match = false

# Drop noisy machine account events prior to indexing to conserve license
[drop_noisy_machine_accounts]
REGEX = (?m)Account Name:\s*([A-Za-z0-9_\-]+)\$
DEST_KEY = queue
FORMAT = nullQueue
