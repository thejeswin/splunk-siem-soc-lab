# ==============================================================================
# Splunk props.conf - Field Extractions, Timestamp Normalization & Lookups
# ==============================================================================

[WinEventLog:Security]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{2}/\d{2}/\d{4}\s\d{2}:\d{2}:\d{2}\s[AP]M)
TIME_PREFIX = \A
TIME_FORMAT = %m/%d/%Y %I:%M:%S %p
MAX_TIMESTAMP_LOOKAHEAD = 32
TRUNCATE = 999999

# Automatic Field Extraction for Event 4625 (Failed Logon)
EXTRACT-4625-fields = Account\sFor\sWhich\sLogon\sFailed:\s+Security\sID:\s+(?<TargetUserSid>[^\r\n]+)\s+Account\sName:\s+(?<TargetUserName>[^\r\n]+)\s+Account\sDomain:\s+(?<TargetDomainName>[^\r\n]+)
EXTRACT-4625-network = Network\sInformation:\s+Workstation\sName:\s+(?<WorkstationName>[^\r\n]+)\s+Source\sNetwork\sAddress:\s+(?<IpAddress>[^\r\n]+)\s+Source\sPort:\s+(?<SourcePort>[^\r\n]+)
EXTRACT-4625-failure = Detailed\sAuthentication\sInformation:\s+Logon\sProcess:\s+(?<LogonProcessName>[^\r\n]+)\s+Authentication\sPackage:\s+(?<AuthenticationPackageName>[^\r\n]+)\s+Transited\sServices:\s+(?<TransitedServices>[^\r\n]+)\s+Package\sName\s\(NTLM\sonly\):\s+(?<PackageName>[^\r\n]+)\s+Key\sLength:\s+(?<KeyLength>[^\r\n]+)\s+Sub\sStatus:\s+(?<SubStatus>0x[0-9a-fA-F]+)

# Lookup Tables
LOOKUP-known_admins = known_admin_service_accounts TargetUserName OUTPUT is_approved_service_account, account_owner, environment_tier
LOOKUP-substatus_descriptions = ntstatus_lookup SubStatus OUTPUT status_meaning, remediation_guidance

[XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
SHOULD_LINEMERGE = false
TIME_PREFIX = <TimeCreated\sSystemTime='
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9NZ
KV_MODE = xml
TRUNCATE = 999999

# Normalized Common Information Model (CIM) Aliases
FIELDALIAS-dest = Computer as dest
FIELDALIAS-src = SourceIp as src
FIELDALIAS-user = User as user
FIELDALIAS-process = Image as process_path
FIELDALIAS-process_name = ProcessName as process
FIELDALIAS-parent_process = ParentImage as parent_process_path

[WinEventLog:Microsoft-Windows-PowerShell/Operational]
SHOULD_LINEMERGE = false
EXTRACT-ps_scriptblock = ScriptBlock\sText:\s*(?<ScriptBlockText>[\s\S]*?)(?=ScriptBlock\sID:)
LOOKUP-ps_malware_signatures = powershell_indicators signature_pattern OUTPUT indicator_threat_level, technique_id
